<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boa Vizinhança</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="wrapper">
    <div class="form-header">
      <div class="titles">
        <div class="title-login">Login</div>
      </div>
    </div>
    <form method="POST" action="{{ url_for('usuarios_bp.login') }}" class="login-form" autocomplete="off">
      <div class="input-box">
        <input type="text" name="email" class="input-field" required>
        <label for="log-email" class="label">Email</label>
        <i class="bi bi-envelope-fill icon"></i>
      </div>

      <div class="input-box">
        <input type="password" name="senha" class="input-field" required>
        <label for="log-pass" class="label">Senha</label>
        <i class="bi bi-lock-fill icon"></i>
      </div>

      <div class="input-box">
        <button type="submit" class="btn-submit" id="SignInBtn">
          Login <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </div>

      <div class="acesso">
        <span>Não tem uma conta? <a href="{{ url_for('acesso') }}">Solicite um acesso!</a></span>
      </div>
    </form>

  </div>

</body>

</html>
