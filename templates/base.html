<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boa Vizinhança - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-house-heart-fill"></i>   Boa Vizinhança</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="{{ url_for('painel') }}" title="Painel" class="nav-link active"><i class="bi bi-grid"></i></a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('chat') }}" title="Chat" class="nav-link"><i class="bi bi-chat-dots-fill"></i></a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('achados_perdidos') }}" title="Buscar" class="av-link"><i class="bi bi-search"></i></a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('servicos') }}" title="Serviços" class="{% if active_page == 'services' %}active-icon{% endif %}"><i class="bi bi-stack"></i></a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('perfil') }}" title="Perfil" class="nav-link"><i class="bi bi-person-fill"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="main p-3">
        {% block content %} {% endblock %}
    </div>
</body>

</html>
