{% extends "base.html" %}
{% block title %}Serviços{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/trabalhos.css') }}">

<div class="container mt-4">
    <div class="row">
        <div class="col">
            <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-4">
                <h4>Serviços</h4>
                <a href="{{ url_for('trabalhos_bp.novo_trabalho') }}" class="btn btn-danger rounded-pill px-4">
                    <i class="bi bi-journal-plus"></i> Mostre seu trabalho!
                </a>
            </div>
            {% for trabalho in trabalhos %}
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title"><strong>{{ trabalho.nome_trabalho }}</strong></h5>
                </div>
                <div class="card-body">
                    <p class="card-text">{{ trabalho.desc }}</p>

                    <div class="card-footer">
                        <small class="text-muted">
                            {{ trabalho.usuario_id}}
                        </small>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
