{% extends "base.html" %}
{% block title %}Achados e Perdidos{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/avisos.css') }}">

<div class="container mt-4">
    <div class="row">
        <div class="col">
            <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-4">
                <h4>Achados e Perdidos</h4>
                <a href="{{ url_for('aeps_bp.novo_aeps') }}" class="btn btn-danger rounded-pill px-4">
                    <i class="bi bi-journal-plus"></i> Achou ou Perdeu Algo? <!-- trocar o nome disso -->
                </a>
            </div>
            {% for aviso in avisos %}
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title"><strong>{{ aviso.nome_aviso }}</strong></h5>
                </div>
                <div class="card-body">
                    <p class="card-text">{{ aviso.descricao }}</p>

                    <div class="card-footer">
                        <small class="text-muted">
                            <p>
                                <{{ aviso.usuario_nome }}</p>
                        </small>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
