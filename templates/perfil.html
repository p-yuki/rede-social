<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condomínio - Meu Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-city"></i>
            <h1>Condomínio</h1>
        </div>
        <nav class="nav-icons">
            <a href="{{ url_for('painel') }}" title="Painel" class="{% if active_page == 'dashboard' %}active-icon{% endif %}">
                <i class="fas fa-th-large"></i> 
            </a> 
            
            <a href="{{ url_for('achados_perdidos') }}" title="Buscar" class="{% if active_page == 'search' %}active-icon{% endif %}"><i class="fas fa-search"></i></a>
            <a href="{{ url_for('chat') }}" title="Chat" class="{% if active_page == 'chat' %}active-icon{% endif %}"><i class="fas fa-comment-dots"></i></a>
            <a href="{{ url_for('servicos') }}" title="Serviços" class="{% if active_page == 'services' %}active-icon{% endif %}"><i class="fas fa-tools"></i></a>
            <a href="{{ url_for('perfil') }}" title="Perfil" class="{% if active_page == 'perfil' %}active-icon{% endif %}"><i class="fas fa-user-circle"></i></a>
        </nav>
    </header>

    <main class="profile-page">
        <div class="profile-container">
            <div class="profile-avatar-area">
                <div class="profile-avatar"></div>
                <h2>{{ perfil_data.nome }}</h2>
            </div>

            <div class="profile-info-card">
                <p>{{ perfil_data.endereco }}</p>
            </div>
            <div class="profile-info-card">
                <p>{{ perfil_data.telefone }}</p>
            </div>
            <div class="profile-info-card">
                <p>{{ perfil_data.email }}</p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
