<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condomínio - Serviços de Moradores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-city"></i>
            <h1>Condomínio</h1>
        </div>
        <nav class="nav-icons">
            <a href="{{ url_for('painel') }}" title="Painel" class="{% if active_page == 'dashboard' %}active-icon{% endif %}"><i class="fas fa-th-large"></i></a>
            <a href="{{ url_for('achados_perdidos') }}" title="Buscar" class="{% if active_page == 'search' %}active-icon{% endif %}"><i class="fas fa-search"></i></a>
            <a href="{{ url_for('chat') }}" title="Chat" class="{% if active_page == 'chat' %}active-icon{% endif %}"><i class="fas fa-comment-dots"></i></a>
            <a href="{{ url_for('servicos') }}" title="Serviços" class="{% if active_page == 'services' %}active-icon{% endif %}"><i class="fas fa-tools"></i></a>
            <a href="{{ url_for('perfil') }}" title="Perfil" class="{% if active_page == 'perfil' %}active-icon{% endif %}"><i class="fas fa-user-circle"></i></a>
        </nav>
    </header>

    <main class="services-page">
        <h2>Serviço de Moradores</h2>
        
        <div class="services-grid">
            
            {% for i in range(9) %}
            <div class="service-card">
                <div class="service-role">CONFEITEIRA</div>
                <div class="service-content">
                    <div class="service-avatar-container">
                        <div class="service-avatar"></div>
                    </div>
                    <div class="service-info">
                        <h3>Maria Fátima</h3>
                        <p>Bloco B</p>
                        <p>Apto 102</p>
                        <div class="service-contact">
                            <i class="fas fa-phone-alt"></i>
                            <span>(11) 94005-8033</span>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
            
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
