{% extends "base.html" %}
{% block title %}Achados e Perdidos{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/avisos.css') }}">

<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header text-center">
                <h4>Achados e Perdidos</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="id">

                    <div class="mb-3">
                        <label for="descricao" class="form-label">O que achou/perdeu? : </label>
                        <input type="text" name="descricao" id="descricao" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="data_aviso" class="form-label">Onde Encontrou/Perdeu?: </label>
                        <input type="text" name="local" id="local" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Achou ou Perdeu?: </label>
                        <select name="status" id="status">
                            <option value="achado">Achei</option>
                            <option value="perdido">Perdi</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="data_encontro" class="form-label">Quando Achou/Perdeu?: </label>
                        <input type="date" name="data_encontro" id="data_encontro" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="contato" class="form-label">Contato (Telefone): </label>
                        <input type="tel" id="contato" name="contato" class="form-control phone-mask"
                            placeholder="(11) 99999-9999" inputmode="tel" autocomplete="tel" maxlength="15" required >
                    </div>

                    <div class="mb-3">
                        <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill px-4">
                                <i class="bi bi-save"></i> {{ "Salvar" if not aviso else "Atualizar" }}
                            </button>
                        </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
